<script>
// ===================== 权威数据源注册表 =====================
const DATA_SOURCES=[
  {id:"weather",name:"中国天气网",url:"https://www.weather.com.cn",org:"中国气象局国家气象信息中心",update:"实时/每日",type:"天气实况与预报"},
  {id:"cma",name:"中国气象数据网",url:"https://data.cma.cn",org:"中国气象局",update:"实时/历史",type:"气象数据开放"},
  {id:"price",name:"全国农产品批发市场价格信息系统",url:"https://pfsc.agri.cn",org:"农业农村部",update:"每日",type:"农产品批发价格"},
  {id:"moa",name:"农业农村部数据开放平台",url:"https://data.moa.gov.cn",org:"农业农村部",update:"每日",type:"农业农村数据"},
  {id:"natesc",name:"全国农业技术推广服务中心",url:"https://www.natesc.org.cn",org:"农业农村部直属",update:"按发布",type:"测土配方施肥"},
  {id:"gz",name:"贵州省农业农村厅",url:"https://nynct.guizhou.gov.cn",org:"贵州省人民政府",update:"实时",type:"省级农业政策"},
  {id:"qiannan",name:"黔南州农业农村局",url:"http://znyncj.qiannan.gov.cn",org:"黔南州人民政府",update:"实时",type:"州级农业政策"},
];
// 都匀市 中国天气网 城市代码
const WX_CITY={code:"101260701",name:"都匀",prov:"贵州"};
const WX_NOW="https://www.weather.com.cn/data/sk/"+WX_CITY.code+".html";
const WX_INFO="https://www.weather.com.cn/data/cityinfo/"+WX_CITY.code+".html";

// ===================== 数据库 =====================
const CROPS={"玉米":{N:2.57,P2O5:0.86,K2O:2.14},"水稻":{N:2.00,P2O5:0.90,K2O:2.60},"小麦":{N:3.00,P2O5:1.00,K2O:2.50},"马铃薯":{N:0.50,P2O5:0.20,K2O:1.06},"油菜":{N:5.80,P2O5:2.50,K2O:4.30},"烤烟":{N:3.45,P2O5:1.15,K2O:5.50},"茶叶":{N:4.50,P2O5:1.50,K2O:2.50},"高粱":{N:2.60,P2O5:1.30,K2O:3.00},"大豆":{N:7.20,P2O5:1.80,K2O:4.00},"辣椒":{N:3.54,P2O5:1.10,K2O:4.50},"番茄":{N:3.00,P2O5:0.80,K2O:4.50},"黄瓜":{N:2.80,P2O5:0.90,K2O:3.90}};
const FERTS={"尿素":{N:46,P2O5:0,K2O:0,type:"化学氮肥"},"碳酸氢铵":{N:17,P2O5:0,K2O:0,type:"化学氮肥"},"过磷酸钙":{N:0,P2O5:16,K2O:0,type:"化学磷肥"},"磷酸二铵(DAP)":{N:18,P2O5:46,K2O:0,type:"复合肥"},"硫酸钾":{N:0,P2O5:0,K2O:50,type:"化学钾肥"},"氯化钾":{N:0,P2O5:0,K2O:60,type:"化学钾肥"},"复合肥(15-15-15)":{N:15,P2O5:15,K2O:15,type:"复合肥"},"复合肥(17-17-17)":{N:17,P2O5:17,K2O:17,type:"复合肥"},"商品有机肥":{N:2.05,P2O5:1.89,K2O:2.03,type:"有机肥"},"微生物菌剂(香满乐)":{N:0,P2O5:0,K2O:0,type:"微生物菌剂",cfu:"2亿/g",pH:8.1},"腐熟农家肥":{N:0.50,P2O5:0.25,K2O:0.60,type:"有机肥"},"饼肥(菜籽饼)":{N:5.00,P2O5:2.50,K2O:1.50,type:"有机肥"}};
const UTIL={"化学氮肥":0.35,"化学磷肥":0.20,"化学钾肥":0.45,"复合肥":0.35,"有机肥":0.25,"微生物菌剂":0.15};
const PH_LEVELS=[{n:"强酸性",min:0,max:5.5,ratio:0.50,amend:true,advice:"有机-无机-生物复合型改良剂 300-500kg/亩"},{n:"弱酸性",min:5.5,max:6.5,ratio:0.25,amend:false,advice:"硝化抑制剂尿素或缓释氮肥"},{n:"中性",min:6.5,max:7.5,ratio:0.15,amend:false,advice:"常规施肥"},{n:"碱性",min:7.5,max:14,ratio:0.10,amend:false,advice:"注意补充铁锌等微量元素"}];
const N_LEVELS={"碱解氮":[["极低",0,60],["低",60,90],["中",90,120],["较高",120,150],["高",150,9999]],"有效磷":[["极低",0,5],["低",5,10],["中",10,20],["较高",20,30],["高",30,9999]],"速效钾":[["极低",0,50],["低",50,100],["中",100,150],["较高",150,200],["高",200,9999]]};
const N_CORR={"碱解氮":0.6,"有效磷":0.5,"速效钾":0.5};
const MICROBIAL={interval:5,reduction:0.25,taboo:"不可与杀菌剂直接混合；不可与未腐熟农家肥混合；不可与高浓度尿素溶液直接混合",method:"微生物菌剂做基施/冲施，化肥做追施，间隔5-7天",amount:"2-5kg/亩"};
const REGIONS={"黔南州":{pH:5.2,type:"黄壤",acid:"82.2%",om:"28.2",note:"全省82.2%黄壤已酸化",aN:90,aP:12,aK:100,advice:"施用石灰+有机肥改良，推广微生物菌剂"},"黔东南州":{pH:5.0,type:"黄壤",acid:"高",om:"30.5",note:"茶园酸化严重",aN:85,aP:10,aK:95,advice:"重施有机肥，配合微生物菌剂改良"},"毕节市":{pH:5.8,type:"黄壤",acid:"中",om:"25.6",note:"马铃薯主产区",aN:100,aP:15,aK:110,advice:"增施有机肥，适度施用石灰"},"遵义市":{pH:5.3,type:"黄壤",acid:"高",om:"31.8",note:"湄潭茶园pH低至4.37",aN:88,aP:11,aK:98,advice:"施用白云石粉改良，重施有机肥"},"铜仁市":{pH:5.5,type:"黄壤",acid:"中",om:"27.3",note:"",aN:95,aP:13,aK:105,advice:"增施有机肥，控制氮肥用量"},"安顺市":{pH:5.6,type:"黄壤",acid:"中",om:"26.1",note:"",aN:98,aP:14,aK:108,advice:"有机无机配合，补充微量元素"}};
const API_KEY="sk-dd24b85a07834bf4b8cffb6d6b6315a4";
const API_URL="https://api.deepseek.com/v1/chat/completions";

// ===================== 香满乐产品 =====================
const PRODUCTS=[
  {name:"香满乐微生物菌剂",tag:"核心产品",specs:["有效活菌数 ≥2亿/g","pH 8.1","形态：颗粒/粉剂"],desc:"复合微生物菌剂，含解磷解钾菌、枯草芽孢杆菌等，改善土壤团粒结构、活化养分、缓解连作障碍。",use:"基施/冲施 2-5kg/亩，与化肥间隔5-7天",match:"搭配化肥可减量25%"},
  {name:"香满乐有机肥",tag:"配套产品",specs:["N 2.05% · P2O5 1.89% · K2O 2.03%","有机质 ≥45%"],desc:"腐熟有机肥，改善贵州酸化黄壤理化性质，提升土壤保水保肥能力。",use:"基肥 300-500kg/亩",match:"与菌剂配合实现有机替代"},
  {name:"香满乐专用配方肥",tag:"定制产品",specs:["可按作物定制 N-P2O5-K2O 配方"],desc:"根据测土配方结果定制，实现「一田一策」精准施肥。",use:"按配方方案施用",match:"配合平台测土计算"}
];

// ===================== 施肥计算引擎 =====================
function getPHLevel(pH){for(let l of PH_LEVELS){if(pH>=l.min&&pH<l.max)return l}return PH_LEVELS[2]}
function getNLevel(nut,v){for(let[l,lo,hi]of N_LEVELS[nut]){if(v>=lo&&v<hi)return l}return"中"}
function calcCropNeed(crop,yield){const u=CROPS[crop]||CROPS["玉米"];return{N:Math.round(yield/100*u.N*100)/100,P2O5:Math.round(yield/100*u.P2O5*100)/100,K2O:Math.round(yield/100*u.K2O*100)/100}}
function calcSoilSupply(s){const f=0.15;return{N:Math.round(s.碱解氮*f*N_CORR["碱解氮"]*100)/100,P2O5:Math.round(s.有效磷*f*N_CORR["有效磷"]*100)/100,K2O:Math.round(s.速效钾*f*N_CORR["速效钾"]*100)/100}}

function calculate(crop,yield,soil,selFerts){
  const cropNeed=calcCropNeed(crop,yield);
  const soilSupply=calcSoilSupply(soil);
  const net={N:Math.max(0,Math.round((cropNeed.N-soilSupply.N)*100)/100),P2O5:Math.max(0,Math.round((cropNeed.P2O5-soilSupply.P2O5)*100)/100),K2O:Math.max(0,Math.round((cropNeed.K2O-soilSupply.K2O)*100)/100)};
  const phInfo=getPHLevel(soil.pH);
  const ratio=phInfo.ratio;
  const totalN=net.N;
  const organicN=Math.round(totalN*ratio*100)/100;
  const chemicalN=Math.round(totalN*(1-ratio)*100)/100;
  const chemNReduced=Math.round(chemicalN*(1-MICROBIAL.reduction)*100)/100;

  const recs={};
  for(let fn of selFerts){
    const fi=FERTS[fn];if(!fi)continue;
    const t=fi.type;
    if(t==="化学氮肥"){
      const need=chemNReduced;
      if(fi.N>0&&need>0){const u=UTIL[t];const amt=Math.round(need/(fi.N/100*u)*100)/100;
        recs[fn]={amt,provides_N:Math.round(amt*fi.N/100*u*100)/100,type:t,content:"N:"+fi.N+"%",util:Math.round(u*100)+"%"};
      }
    }else if(t==="有机肥"){
      const need=organicN;
      if(fi.N>0&&need>0){const u=UTIL[t];const amt=Math.round(need/(fi.N/100*u)*100)/100;
        recs[fn]={amt,provides_N:Math.round(amt*fi.N/100*u*100)/100,provides_P2O5:Math.round(amt*fi.P2O5/100*u*100)/100,provides_K2O:Math.round(amt*fi.K2O/100*u*100)/100,type:t,content:"N:"+fi.N+"%,P2O5:"+fi.P2O5+"%,K2O:"+fi.K2O+"%",util:Math.round(u*100)+"%"};
      }
    }else if(t==="复合肥"){
      const need=net.P2O5;
      if(fi.P2O5>0&&need>0){const u=UTIL[t];const amt=Math.round(need/(fi.P2O5/100*u)*100)/100;
        recs[fn]={amt,provides_N:Math.round(amt*fi.N/100*u*100)/100,provides_P2O5:Math.round(amt*fi.P2O5/100*u*100)/100,provides_K2O:Math.round(amt*fi.K2O/100*u*100)/100,type:t,content:"N:"+fi.N+"%,P2O5:"+fi.P2O5+"%,K2O:"+fi.K2O+"%",util:Math.round(u*100)+"%"};
      }
    }else if(t==="微生物菌剂"){
      recs[fn]={amt:MICROBIAL.amount,type:t,content:"CFU:"+(fi.cfu||""),util:"-",note:"搭配菌剂时化肥减量"+Math.round(MICROBIAL.reduction*100)+"%"};
    }else if(t==="化学磷肥"){
      const need=net.P2O5;
      if(fi.P2O5>0&&need>0){const u=UTIL[t];const amt=Math.round(need/(fi.P2O5/100*u)*100)/100;
        recs[fn]={amt,provides_P2O5:Math.round(amt*fi.P2O5/100*u*100)/100,type:t,content:"P2O5:"+fi.P2O5+"%",util:Math.round(u*100)+"%"};
      }
    }else if(t==="化学钾肥"){
      const need=net.K2O;
      if(fi.K2O>0&&need>0){const u=UTIL[t];const amt=Math.round(need/(fi.K2O/100*u)*100)/100;
        recs[fn]={amt,provides_K2O:Math.round(amt*fi.K2O/100*u*100)/100,type:t,content:"K2O:"+fi.K2O+"%",util:Math.round(u*100)+"%"};
      }
    }
  }

  const schedule=[];
  const basal=[],top=[],kalium=[];
  for(let[fn,info]of Object.entries(recs)){
    if(info.type==="有机肥"||info.type==="微生物菌剂"||info.type==="化学磷肥"){basal.push(fn+" "+info.amt+"kg/亩")}
    if(info.type==="化学氮肥"||info.type==="复合肥"){
      const a=info.amt;
      top.push(fn+" 第一次追肥 "+Math.round(a*0.6*100)/100+"kg/亩");
      top.push(fn+" 第二次追肥 "+Math.round(a*0.4*100)/100+"kg/亩");
    }
    if(info.type==="化学钾肥"){kalium.push(fn+" "+info.amt+"kg/亩")}
  }
  if(basal.length)schedule.push({time:"基肥（播种前7-10天）",items:basal,method:"结合翻耕均匀施入土壤",note:"微生物菌剂与化肥间隔5-7天施用"});
  if(top.length)schedule.push({time:"追肥（分两次）",items:top,method:"第一次在苗期/分蘖期，第二次在拔节期/膨大期",note:"追肥后及时浇水，提高肥料利用率"});
  if(kalium.length)schedule.push({time:"基肥或早期追肥",items:kalium,method:"钾肥作基肥一次性施用",note:"沙质土壤分次施用减少流失"});

  return{crop,yield:yield+" kg/亩",
    soil_analysis:{pH:soil.pH,pH_level:phInfo.n,N_level:getNLevel("碱解氮",soil.碱解氮),P_level:getNLevel("有效磷",soil.有效磷),K_level:getNLevel("速效钾",soil.速效钾)},
    nutrient_balance:{crop_need:cropNeed,soil_supply:soilSupply,net_demand:net},
    organic_sub:{ratio:Math.round(ratio*100)+"%",chem_n:chemicalN+" kg/亩",org_n:organicN+" kg/亩",chem_n_reduced:chemNReduced+" kg/亩",reduction:Math.round(MICROBIAL.reduction*100)+"%"},
    amendment:{need:phInfo.amend,advice:phInfo.advice},
    recs,schedule,safety:MICROBIAL.taboo
  };
}

async function aiChat(msg){
  const sysPrompt="你是黔南农科AI助手，专注于贵州农业技术指导。你了解贵州黄壤酸化特征（82.2%酸化），擅长有机肥替代、微生物菌剂混施、测土配方施肥。回答要专业、实用、接地气，用中文回答。数据需注明来自权威来源，不做预测，只给基于标准和公开数据的分析建议。";
  try{
    const res=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+API_KEY},
      body:JSON.stringify({model:"deepseek-chat",messages:[{role:"system",content:sysPrompt},{role:"user",content:msg}],max_tokens:2000,temperature:0.7,stream:false})});
    if(res.ok){const d=await res.json();return{status:"success",reply:d.choices[0].message.content}}
    return{status:"error",reply:"AI服务暂时不可用（HTTP "+res.status+"），请稍后重试。"}
  }catch(e){return{status:"error",reply:"连接失败："+e.message}}
}

      <div class="fg"><label class="fl">作物类型</label><select class="fs" onchange="calcState.crop=this.value">${Object.keys(CROPS).map(c=>`<option ${calcState.crop===c?'selected':''}>${c}</option>`).join("")}</select></div>
      <div class="fg"><label class="fl">目标产量 <span class="u">kg/亩</span></label><input class="fi" type="number" value="${calcState.yield}" onchange="calcState.yield=+this.value"></div>
      <div class="fg"><label class="fl">土壤pH值</label><input class="fi" type="number" step="0.1" value="${calcState.pH}" onchange="calcState.pH=+this.value"></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">碱解氮 <span class="u">mg/kg</span></label><input class="fi" type="number" value="${calcState.aN}" onchange="calcState.aN=+this.value"></div>
      <div class="fg"><label class="fl">有效磷 <span class="u">mg/kg</span></label><input class="fi" type="number" value="${calcState.aP}" onchange="calcState.aP=+this.value"></div>
      <div class="fg"><label class="fl">速效钾 <span class="u">mg/kg</span></label><input class="fi" type="number" value="${calcState.aK}" onchange="calcState.aK=+this.value"></div>
      <div class="fg"><label class="fl">有机质 <span class="u">g/kg</span></label><input class="fi" type="number" value="${calcState.om}" onchange="calcState.om=+this.value"></div>
    </div>
  </div>
  <div class="card"><div class="ct">🧪 选择肥料（可多选）</div><div style="display:flex;gap:8px;flex-wrap:wrap">${ferts}</div></div>
  <div style="margin-bottom:20px">
    <button class="bp btn" onclick="doCalc()">${calcState.loading?'<span class="sp"></span>':'🧮 开始计算'}</button>
  </div>
  ${calcState.error?`<div class="al aw">⚠️ ${calcState.error}</div>`:''}
  ${calcState.result?renderCalcResult(calcState.result):''}`;
}

function toggleFert(f){calcState.ferts.includes(f)?calcState.ferts=calcState.ferts.filter(x=>x!==f):calcState.ferts.push(f);render()}
function doCalc(){
  calcState.loading=true;calcState.error="";calcState.result=null;render();
  try{
    const r=calculate(calcState.crop,calcState.yield,{pH:calcState.pH,碱解氮:calcState.aN,有效磷:calcState.aP,速效钾:calcState.aK,有机质:calcState.om},calcState.ferts);
    calcState.result=r;
  }catch(e){calcState.error=e.message}
  calcState.loading=false;render();
}

function renderCalcResult(r){
  const badge=l=>{if(l.includes('酸'))return`<span class="bg2 bd2">${l}</span>`;if(l.includes('低')||l.includes('极低'))return`<span class="bg2 bw">${l}</span>`;if(l.includes('高')||l.includes('较高'))return`<span class="bg2 bi2">${l}</span>`;return`<span class="bg2 bs">${l}</span>`};
  return `
  <div class="card"><div class="ct">🌱 土壤分析结果</div>
    <div class="rg">
      <div class="ri ${r.soil_analysis.pH<5.5?'dn':''}"><div class="rl">土壤pH</div><div class="rv">${r.soil_analysis.pH}</div><div class="rd">${badge(r.soil_analysis.pH_level)}</div></div>
      <div class="ri"><div class="rl">碱解氮水平</div><div class="rv" style="font-size:15px">${badge(r.soil_analysis.N_level)}</div></div>
      <div class="ri"><div class="rl">有效磷水平</div><div class="rv" style="font-size:15px">${badge(r.soil_analysis.P_level)}</div></div>
      <div class="ri"><div class="rl">速效钾水平</div><div class="rv" style="font-size:15px">${badge(r.soil_analysis.K_level)}</div></div>
    </div>
    ${r.amendment.need?`<div class="al aw">⚠️ ${r.amendment.advice}</div>`:''}
    <div class="src"><span class="dot"></span>计算依据：NY/T 2911-2025《测土配方施肥技术规程》· 土壤养分丰缺指标参考全国农技中心数据</div>
  </div>
  <div class="card"><div class="ct">⚖️ 养分平衡分析</div>
    <table><thead><tr><th>养分元素</th><th>目标产量需肥量 (kg/亩)</th><th>土壤供肥量 (kg/亩)</th><th>净需肥量 (kg/亩)</th></tr></thead><tbody>
      ${["N","P2O5","K2O"].map(el=>`<tr><td><strong>${el}</strong></td><td>${r.nutrient_balance.crop_need[el]}</td><td>${r.nutrient_balance.soil_supply[el]}</td><td><strong style="color:var(--p)">${r.nutrient_balance.net_demand[el]}</strong></td></tr>`).join("")}
    </tbody></table>
  </div>
  <div class="card"><div class="ct">🔄 有机替代与菌剂减量</div>
    <div class="rg">
      <div class="ri"><div class="rl">有机替代比例</div><div class="rv">${r.organic_sub.ratio}</div></div>
      <div class="ri"><div class="rl">化学氮需求</div><div class="rv">${r.organic_sub.chem_n}</div></div>
      <div class="ri"><div class="rl">有机氮需求</div><div class="rv">${r.organic_sub.org_n}</div></div>
      <div class="ri wn"><div class="rl">菌剂减量后化学氮</div><div class="rv">${r.organic_sub.chem_n_reduced}</div><div class="rd">化肥减量率: ${r.organic_sub.reduction}</div></div>
    </div>
  </div>
  <div class="card"><div class="ct">📦 推荐施肥方案</div>
    <table><thead><tr><th>肥料名称</th><th>类型</th><th>推荐用量</th><th>养分含量</th><th>利用率</th></tr></thead><tbody>
      ${Object.entries(r.recs).map(([n,i])=>`<tr><td><strong>${n}</strong></td><td><span class="bg2 bi2">${i.type}</span></td><td><strong style="color:var(--p)">${i.amt} kg/亩</strong></td><td style="font-size:11.5px">${i.content||'-'}</td><td>${i.util||'-'}</td></tr>`).join("")}
    </tbody></table>
  </div>
  ${r.schedule.length?`<div class="card"><div class="ct">📅 施肥时期方案</div>${r.schedule.map(s=>`<div class="ri" style="margin-bottom:12px"><div class="rl" style="font-weight:600;color:var(--pd);font-size:14px">${s.time}</div><div style="margin-top:6px;font-size:13px">${s.items.map(f=>`<div>• ${f}</div>`).join("")}</div><div class="rd" style="margin-top:6px">方法：${s.method}<br>注意：${s.note}</div></div>`).join("")}</div>`:''}
  <div class="card"><div class="ct">⚠️ 安全注意事项</div><div class="al aw" style="white-space:pre-wrap">${r.safety}</div>
    <div class="src" style="margin-top:8px"><span class="dot w"></span>本结果为标准化计算结果，最终施肥以当地农技部门测土配方和指导意见为准。</div>
  </div>`;
}

function renderAI(){
  return `<div class="ph"><h2>AI农技问答</h2><p>基于DeepSeek大模型 · 数据来自权威官网，AI做分析参考，不做预测</p></div>
  <div class="cc">
    <div class="cm" id="chatBox">
      ${chatMsgs.map(m=>`<div class="msg"><div class="av ${m.role==='user'?'u':'a'}">${m.role==='user'?'👤':'🤖'}</div><div class="bb ${m.role==='user'?'u':'a'}">${m.content}</div></div>`).join("")}
      ${chatLoading?`<div class="msg"><div class="av a">🤖</div><div class="bb a"><span class="ld"><span></span><span></span><span></span></span></div></div>`:''}
    </div>
    ${chatMsgs.length<=2?`<div style="margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap">${["贵州土壤酸化怎么治理？","玉米种植如何科学施肥？","微生物菌剂和化肥能混用吗？","有机肥替代化肥的比例怎么算？"].map(q=>`<button class="bo btn" style="font-size:12px" onclick="chatInput='${q}';render()">${q}</button>`).join("")}</div>`:''}
    <div class="ir">
      <textarea class="ft" placeholder="输入您的农业问题... (Enter发送)" id="chatInput" rows="2" oninput="chatInput=this.value" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendChat()}">${chatInput}</textarea>
      <button class="bp btn" onclick="sendChat()" ${chatLoading||!chatInput?'disabled':''}>${chatLoading?'<span class="sp"></span>':'发送'}</button>
    </div>
  </div>`;
}

async function sendChat(){
  const msg=chatInput.trim();if(!msg||chatLoading)return;
  chatMsgs.push({role:"user",content:msg});chatInput="";chatLoading=true;render();
  const box=document.getElementById("chatBox");if(box)box.scrollTop=box.scrollHeight;
  const res=await aiChat(msg);
  chatMsgs.push({role:"ai",content:res.status==="success"?res.reply:"抱歉，AI服务暂时不可用，请稍后重试。"});
  chatLoading=false;render();
  setTimeout(()=>{const b=document.getElementById("chatBox");if(b)b.scrollTop=b.scrollHeight},100);
}
